name: Terraform CI

# Revisamos cada PR hacia main y volvemos a comprobar main tras incorporar los cambios.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  # Este workflow solo necesita leer el código del repositorio.
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    # El ruleset de main exige este nombre exacto; cambiarlo requiere actualizar la regla.
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: "v0.64.0"
          # Reutiliza plugins; la acción usa la configuración de TFLint para identificar la caché.
          cache: true

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize Terraform
        # Descarga dependencias sin acceder al backend del estado ni pedir respuestas interactivas.
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          # Token temporal de GitHub: autentica las descargas y aumenta el límite de peticiones.
          # Lo proporciona GitHub automáticamente; no hace falta crear una clave de Google Cloud.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        # Incluye los módulos; compact produce mensajes compatibles con las anotaciones de la acción.
        # Usamos una ruta absoluta para que todos los módulos carguen también las reglas de Google.
        run: tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact
